<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="548" viewBox="0 0 1280 548" role="img" aria-labelledby="title desc"><title id="title">Walmart Sales Intelligence project overview</title><desc id="desc">Branded project illustration showing 6.74 billion dollars in sales, 45 stores, 6435 store-week records, and top stores ranked by sales. This is a documentation illustration, not an application screenshot.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#08264E"/><stop offset="100%" stop-color="#06162E"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFC220"/><stop offset="100%" stop-color="#FEE289"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#183D6E"/><stop offset="100%" stop-color="#102D55"/></linearGradient></defs><rect width="1280" height="548" rx="26" fill="url(#bg)"/><circle cx="1120" cy="-10" r="330" fill="#0879E9" opacity=".13"/><circle cx="100" cy="550" r="240" fill="#0053E2" opacity=".12"/><rect x="0" y="0" width="1280" height="8" fill="#0053E2"/><rect x="0" y="0" width="365" height="8" fill="#FFC220"/><rect x="60" y="43" width="43" height="43" rx="13" fill="#FFC220"/><g stroke="#062953" stroke-width="5.5" stroke-linecap="round"><path d="M82 54v21M70 64l22 3M72 78l19-17"/></g><text x="120" y="61" font-family="Arial,sans-serif" font-size="19" font-weight="800" fill="#FFF">WALMART</text><text x="120" y="81" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#76ADFA">SALES INTELLIGENCE</text><rect x="998" y="48" width="224" height="32" rx="16" fill="#12395F" stroke="#2F6091"/><circle cx="1019" cy="64" r="5" fill="#FFC220"/><text x="1033" y="69" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#CBDEFA">RETAIL DATA ANALYTICS</text><text x="60" y="151" font-family="Arial,sans-serif" font-size="58" font-weight="800" fil